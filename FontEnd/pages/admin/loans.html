<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Mượn Trả - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css?v=3">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>

<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-book-open"></i> Thư Viện Admin</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Tổng Quan</a></li>
                <li><a href="books.html"><i class="fa-solid fa-book"></i> Quản Lý Sách</a></li>
                <li><a href="readers.html"><i class="fa-solid fa-users"></i> Độc Giả</a></li>
                <li><a href="loans.html" class="active"><i class="fa-solid fa-hand-holding-hand"></i> Mượn - Trả</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer" style="padding: 15px;">
            <button id="logoutBtn" class="btn btn-secondary btn-block"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng Xuất</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="header-search">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" id="loanSearchInput" placeholder="Tìm: tên Độc Giả, số thẻ, tên sách..." oninput="timkiemPhieuMuon(this.value)">
            </div>
            <div class="header-user">
                <span style="font-weight: 500;" id="userNameDisplay">Admin User</span>
                <div class="avatar">A</div>
            </div>
        </header>

        <div class="content-container table-page">
            <div class="d-flex justify-between align-center" style="margin-bottom: 8px;">
                <h1 style="color: var(--primary-color);">Quản Lý Mượn Trả Sách</h1>
                <button class="btn btn-primary" onclick="moModalTaoPhieu()"><i class="fa-solid fa-plus"></i> Tạo Phiếu Mượn</button>
            </div>

            <!-- Tab chuyển đổi -->
            <div style="display:flex;gap:8px;margin-bottom:8px;">
                <button id="btnTabActive" class="btn btn-primary">Đang Mượn</button>
                <button id="btnTabOverdue" class="btn btn-secondary">Quá Hạn</button>
                <button id="btnTabHistory" class="btn btn-secondary">Lịch Sử Theo Độc Giả</button>
            </div>
            
            <div class="card">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã Phiếu</th>
                                <th>Độc Giả</th>
                                <th>Ngày Mượn</th>
                                <th>Hạn Trả</th>
                                <th>Trạng Thái</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="loanTableBody">
                            <tr><td colspan="6" style="text-align:center">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang (10 hàng/trang) -->
                <div class="d-flex justify-between align-center mt-2 pt-2" style="border-top: 1px solid var(--border-color);">
                    <span class="text-muted" id="loanPageInfo" style="font-size: 0.85rem;"></span>
                    <div id="loanPagination" style="display: flex; gap: 5px;"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal Tạo Phiếu Mượn -->
<div id="loanModal" style="display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,0.5);overflow-y:auto;padding:20px 10px;">
    <div style="background:#fff;margin:2vh auto;padding:20px 25px;border-radius:8px;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow-y:auto;box-sizing:border-box;">
        <h2 style="margin-top:0">Tạo Phiếu Mượn Sách</h2>
        <form id="loanForm">
            <div style="margin-bottom:12px">
                <label>ID Độc Giả (reader_id) <span style="color:red">*</span></label>
                <input type="text" id="loanReaderId" class="form-control" style="width:100%;padding:8px;box-sizing:border-box"
                    placeholder="Nhập GUID của độc giả" required>
            </div>
            <div style="margin-bottom:12px">
                <label>ID Bản Sao Sách (copy_id) — mỗi ID một dòng <span style="color:red">*</span></label>
                <textarea id="loanCopyIds" class="form-control" rows="4" style="width:100%;padding:8px;box-sizing:border-box"
                    placeholder="Ví dụ:&#10;xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx&#10;yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy" required></textarea>
            </div>
            <div style="margin-bottom:12px">
                <label>Hạn Trả <span style="color:red">*</span></label>
                <input type="date" id="loanDueDate" class="form-control" style="width:100%;padding:8px;box-sizing:border-box" required>
            </div>
            <div id="loanModalError" style="color:red;margin-bottom:10px;display:none"></div>
            <div style="display:flex;justify-content:flex-end;gap:10px">
                <button type="button" class="btn btn-secondary" onclick="dongModalLoan()">Hủy</button>
                <button type="submit" class="btn btn-primary" id="btnSaveLoan">Tạo Phiếu</button>
            </div>
        </form>
    </div>
</div>

<script src="../../js/api.js?v=2"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/loans.js?v=2"></script>
<script>
    requireAuth(['admin','Admin']);
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(user.name) document.getElementById('userNameDisplay').textContent = user.name;
</script>
</body>
</html>
