<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Hệ thống Quản lý Thư viện</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        .login-card { width: 100%; max-width: 400px; padding: 40px 30px; }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { color: var(--primary-color); margin-bottom: 8px; font-size: 1.5rem; }
        .login-header p { color: var(--text-muted); font-size: 0.9rem; }
        .error-message, .ok-message {
            display: none;
            padding: 10px;
            border-radius: var(--border-radius-sm);
            margin-bottom: 20px;
            font-size: 0.85rem;
            text-align: center;
        }
        .error-message { background-color: #fee2e2; color: #991b1b; }
        .ok-message { background-color: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="full-screen-center">
        <div class="card login-card">
            <div class="login-header">
                <h1>Quên mật khẩu</h1>
                <p>Nhập email đã đăng ký. Áp dụng cho tài khoản nhân viên và bạn đọc.</p>
            </div>

            <div class="error-message" id="formError"></div>
            <div class="ok-message" id="formOk"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="email@thu-vien.vn" autocomplete="email" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="padding: 12px; margin-top: 20px; font-size: 1rem;">
                    Gửi hướng dẫn
                </button>
            </form>

            <div class="text-center mt-2" style="font-size: 0.9rem;">
                <a href="/index.html">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js?v=3"></script>
    <script src="../js/password-reset.js?v=1"></script>
</body>
</html>
