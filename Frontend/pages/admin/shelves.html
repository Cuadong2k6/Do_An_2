<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Kệ Sách - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-book-open"></i> Thư Viện Admin</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Tổng Quan</a></li>
                <li><a href="books.html"><i class="fa-solid fa-book"></i> Quản Lý Sách</a></li>
                <li><a href="copies.html"><i class="fa-solid fa-copy"></i> Bản Sao Sách</a></li>
                <li><a href="shelves.html" class="active"><i class="fa-solid fa-warehouse"></i> Kệ Sách</a></li>
                <li><a href="readers.html"><i class="fa-solid fa-users"></i> Độc Giả</a></li>
                <li><a href="loans.html"><i class="fa-solid fa-hand-holding-hand"></i> Mượn - Trả</a></li>
                <li><a href="reservations.html"><i class="fa-solid fa-calendar-check"></i> Đặt Chỗ</a></li>
                <li><a href="fines.html"><i class="fa-solid fa-money-bill-wave"></i> Tiền Phạt</a></li>
                <li><a href="reports.html"><i class="fa-solid fa-chart-bar"></i> Báo Cáo</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer" style="padding: 15px;">
            <button id="logoutBtn" class="btn btn-secondary btn-block"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng Xuất</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="top-header">
            <div class="header-search">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" id="shelfSearchInput" placeholder="Tìm: mã kệ, vị trí..." oninput="TimkiemKeSach()">
            </div>
            <div class="header-user">
                <span style="font-weight: 500;" id="userNameDisplay">Admin User</span>
                <div class="avatar">A</div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="content-container table-page">
            <div class="d-flex justify-between align-center" style="margin-bottom: 8px;">
                <h1 style="color: var(--primary-color);">Quản Lý Kệ Sách</h1>
                <button class="btn btn-primary" onclick="moModalThemKe()"><i class="fa-solid fa-plus"></i> Thêm Kệ Mới</button>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã Kệ</th>
                                <th>Vị Trí / Mã Vị Trí</th>
                                <th>Mô Tả</th>
                                <th>Số Bản Sao</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="shelfTableBody">
                            <tr><td colspan="5" style="text-align:center">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang -->
                <div class="d-flex justify-between align-center mt-2 pt-2" style="border-top: 1px solid var(--border-color);">
                    <span class="text-muted" id="shelfPageInfo" style="font-size: 0.85rem;"></span>
                    <div id="shelfPagination" style="display: flex; gap: 5px;"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal Thêm/Sửa Kệ -->
<div id="shelfModal" style="display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,0.5);overflow-y:auto;padding:20px 10px;">
    <div style="background:#fff;margin:2vh auto;padding:20px 25px;border-radius:8px;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow-y:auto;box-sizing:border-box;">
        <h2 id="shelfModalTitle" style="margin-top:0">Thêm Kệ Sách Mới</h2>
        <form id="shelfForm">
            <div style="margin-bottom:12px">
                <label>Mã Vị Trí (location_code) <span style="color:red">*</span></label>
                <input type="text" id="shelfLocationCode" class="form-control" style="width:100%;padding:8px;box-sizing:border-box" placeholder="VD: A-01, B-02, KHO-01" required>
            </div>
            <div style="margin-bottom:12px">
                <label>Mô Tả</label>
                <textarea id="shelfMota" class="form-control" rows="3" style="width:100%;padding:8px;box-sizing:border-box" placeholder="Vị trí chi tiết, ghi chú..."></textarea>
            </div>
            <div id="shelfModalError" style="color:red;margin-bottom:10px;display:none"></div>
            <div style="display:flex;justify-content:flex-end;gap:10px">
                <button type="button" class="btn btn-secondary" onclick="DongModalKeSach()">Hủy</button>
                <button type="submit" class="btn btn-primary" id="btnSaveShelf">Lưu</button>
            </div>
        </form>
    </div>
</div>

<script src="../../js/api.js?v=2"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/shelves.js?v=2"></script>
<script>
    YeuCauXacThuc(['admin','Admin','thuthu','ThuThu']);
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(user.name) document.getElementById('userNameDisplay').textContent = user.name;
</script>
</body>
</html>
