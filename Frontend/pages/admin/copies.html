<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bản Sao Sách - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css?v=3">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-book-open"></i> Thư Viện Admin</h2>
        </div>
        <nav class="sidebar-nav">
            <ul id="adminMenu"></ul>
        </nav>
        <div class="sidebar-footer" style="padding: 15px;">
            <button id="logoutBtn" class="btn btn-secondary btn-block"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng Xuất</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="top-header">
            <div class="header-search">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" id="copySearchInput" placeholder="Tìm: mã bản sao, tên sách, ISBN..." oninput="TimkiemBanSao()">
            </div>
            <div class="header-user">
                <span style="font-weight: 500;" id="userNameDisplay">Admin User</span>
                <div class="avatar">A</div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="content-container table-page">
            <div class="d-flex justify-between align-center" style="margin-bottom: 8px;">
                <h1 style="color: var(--primary-color);">Quản Lý Bản Sao Vật Lý</h1>
                <button class="btn btn-primary" onclick="moModalThemBanSao()"><i class="fa-solid fa-plus"></i> Thêm Bản Sao</button>
            </div>

            <!-- Bộ lọc -->
            <div class="d-flex" style="gap:8px;margin-bottom:8px;flex-wrap:wrap;">
                <select id="filterCopyBook" class="form-control" onchange="LocBanSao()" style="flex:1;min-width:200px">
                    <option value="">Tất cả đầu sách</option>
                </select>
                <select id="filterCopyStatus" class="form-control" onchange="LocBanSao()" style="flex:1;min-width:150px">
                    <option value="">Tất cả trạng thái</option>
                    <option value="0">Sẵn có (0)</option>
                    <option value="1">Đã mượn (1)</option>
                    <option value="2">Hỏng (2)</option>
                </select>
                <select id="filterCopyShelf" class="form-control" onchange="LocBanSao()" style="flex:1;min-width:150px">
                    <option value="">Tất cả kệ</option>
                </select>
                <button class="btn btn-secondary" onclick="DatLaiLocBanSao()">Đặt lại</button>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã Bản Sao</th>
                                <th>Đầu Sách</th>
                                <th>ISBN</th>
                                <th>Kệ</th>
                                <th>Trạng Thái</th>
                                <th>Ngày Nhập</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="copyTableBody">
                            <tr><td colspan="7" style="text-align:center">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang -->
                <div class="d-flex justify-between align-center mt-2 pt-2" style="border-top: 1px solid var(--border-color);">
                    <span class="text-muted" id="copyPageInfo" style="font-size: 0.85rem;"></span>
                    <div id="copyPagination" style="display: flex; gap: 5px;"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal Thêm/Sửa Bản Sao -->
<div id="copyModal" style="display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,0.5);overflow-y:auto;padding:20px 10px;">
    <div style="background:#fff;margin:2vh auto;padding:20px 25px;border-radius:8px;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow-y:auto;box-sizing:border-box;">
        <h2 id="copyModalTitle" style="margin-top:0">Thêm Bản Sao Mới</h2>
        <form id="copyForm">
            <div style="margin-bottom:12px">
                <label>Đầu Sách (book_id) <span style="color:red">*</span></label>
                <select id="copyBookId" class="form-control" style="width:100%;padding:8px;box-sizing:border-box" required></select>
            </div>
            <div style="margin-bottom:12px">
                <label>Mã Bản Sao <span style="color:red">*</span></label>
                <input type="text" id="copyMaBanSao" class="form-control" style="width:100%;padding:8px;box-sizing:border-box" placeholder="VD: BC-ISBN-001" required>
            </div>
            <div style="margin-bottom:12px;display:flex;gap:10px">
                <div style="flex:1">
                    <label>Kệ Sách</label>
                    <select id="copyShelfId" class="form-control" style="width:100%;padding:8px;box-sizing:border-box">
                        <option value="">Chưa đặt kệ</option>
                    </select>
                </div>
                <div style="flex:1">
                    <label>Trạng Thái</label>
                    <select id="copyStatus" class="form-control" style="width:100%;padding:8px;box-sizing:border-box">
                        <option value="0">Sẵn có (0)</option>
                        <option value="1">Đã mượn (1)</option>
                        <option value="2">Hỏng (2)</option>
                    </select>
                </div>
            </div>
            <div id="copyModalError" style="color:red;margin-bottom:10px;display:none"></div>
            <div style="display:flex;justify-content:flex-end;gap:10px">
                <button type="button" class="btn btn-secondary" onclick="dongModalCopy()">Hủy</button>
                <button type="submit" class="btn btn-primary" id="btnSaveCopy">Lưu</button>
            </div>
        </form>
    </div>
</div>

<script src="../../js/api.js?v=3"></script>
<script src="../../js/auth.js?v=3"></script>
<script src="../../js/sidebar.js?v=1"></script>
<script src="../../js/copies.js?v=3"></script>
<script>
    YeuCauXacThuc(['admin','Admin','thuthu','ThuThu']);
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(user.name) document.getElementById('userNameDisplay').textContent = user.name;
</script>
</body>
</html>
