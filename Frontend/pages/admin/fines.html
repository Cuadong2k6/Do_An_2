<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Tiền Phạt - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css?v=3">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-book-open"></i> Thư Viện Admin</h2>
        </div>
        <nav class="sidebar-nav">
            <ul id="adminMenu"></ul>
        </nav>
        <div class="sidebar-footer" style="padding: 15px;">
            <button id="logoutBtn" class="btn btn-secondary btn-block"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng Xuất</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="top-header">
            <div class="header-search">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" id="fineSearchInput" placeholder="Tìm: tên Độc Giả, số thẻ..." oninput="TimkiemPhat()">
            </div>
            <div class="header-user">
                <span style="font-weight: 500;" id="userNameDisplay">Admin User</span>
                <div class="avatar">A</div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="content-container table-page">
            <div class="d-flex justify-between align-center" style="margin-bottom: 8px;">
                <h1 style="color: var(--primary-color);">Quản Lý Tiền Phạt Trễ Hạn</h1>
            </div>

            <!-- Tab trạng thái thanh toán -->
            <div style="display:flex;gap:8px;margin-bottom:8px;">
                <button id="fineTabUnpaid" class="btn btn-primary" onclick="ChuyenTabPhat(false)">Chưa thu</button>
                <button id="fineTabPaid" class="btn btn-secondary" onclick="ChuyenTabPhat(true)">Đã thu</button>
                <button id="fineTabAll" class="btn btn-secondary" onclick="ChuyenTabPhat(null)">Tất cả</button>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã Phạt</th>
                                <th>Độc Giả</th>
                                <th>Số Thẻ</th>
                                <th>Mã Phiếu Mượn</th>
                                <th>Số Ngày Trễ</th>
                                <th>Tiền Phạt</th>
                                <th>Ngày Tạo</th>
                                <th>Trạng Thái</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="fineTableBody">
                            <tr><td colspan="9" style="text-align:center">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang -->
                <div class="d-flex justify-between align-center mt-2 pt-2" style="border-top: 1px solid var(--border-color);">
                    <span class="text-muted" id="finePageInfo" style="font-size: 0.85rem;"></span>
                    <div id="finePagination" style="display: flex; gap: 5px;"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="../../js/api.js?v=3"></script>
<script src="../../js/auth.js?v=3"></script>
<script src="../../js/sidebar.js?v=1"></script>
<script src="../../js/fines.js?v=3"></script>
<script>
    YeuCauXacThuc(['admin','Admin','thuthu','ThuThu']);
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(user.name) document.getElementById('userNameDisplay').textContent = user.name;
</script>
</body>
</html>
