<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Sách - Thư Viện</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-book-open"></i> Xin chào Bạn đọc</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="search.html" class="active"><i class="fa-solid fa-magnifying-glass"></i> Tra Cứu Sách</a></li>
                <li><a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử Mượn</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer" style="padding: 15px;">
            <button id="logoutBtn" class="btn btn-secondary btn-block"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng Xuất</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="top-header">
            <div>
                <button id="btnGioHang" class="btn btn-primary" style="display:none;" onclick="MoModalGioHang()">
                    <i class="fa-solid fa-cart-shopping"></i> Giỏ Mượn
                    <span class="badge badge-danger" id="gioHangCount">0</span>
                </button>
            </div>
            <div class="header-user">
                <span style="font-weight: 500;" id="userNameDisplay">Reader User</span>
                <div class="avatar" style="background-color: var(--secondary-color);">R</div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="content-container">
            <h1 style="margin-bottom: 24px; color: var(--primary-color);">Tra Cứu Tài Liệu</h1>
            
            <div class="card">
                <form id="searchForm" class="d-flex align-center" style="gap:15px;flex-wrap:wrap;">
                    <div style="flex:1;min-width:200px;">
                        <input type="text" class="form-control" placeholder="Nhập tên sách, tác giả hoặc ISBN..." id="searchInput">
                    </div>
                    <select id="searchTheloai" class="form-control" style="width:auto;min-width:170px">
                        <option value="">Tất cả thể loại</option>
                    </select>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-magnifying-glass"></i> Tìm Kiếm
                    </button>
                </form>
            </div>

            <div class="card mt-2">
                <h3>Kết Quả Tìm Kiếm</h3>
                <div id="ketQuaTimKiem" class="mt-1">
                    <p class="text-muted">Đang tải danh sách sách...</p>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Modal Giỏ Mượn -->
<div id="gioHangModal" style="display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,0.5);overflow-y:auto;padding:20px 10px;">
    <div class="card" style="max-width:640px;margin:0 auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 style="margin:0">Giỏ Mượn</h2>
            <button type="button" class="btn btn-secondary" onclick="DongModalGioHang()">Đóng</button>
        </div>

        <div id="gioHangDanhSach"></div>

        <div class="form-group" style="margin-top:16px;">
            <label class="form-label" for="gioHangNgayTra">Ngày trả sách</label>
            <input type="date" id="gioHangNgayTra" class="form-control">
            <p class="text-muted" style="font-size:0.8rem;margin-top:4px;">
                Mặc định trả sau <span id="gioHangSoNgayMacDinh">14</span> ngày kể từ hôm nay.
            </p>
        </div>

        <div id="gioHangThongBao" style="display:none;padding:10px;border-radius:6px;margin-bottom:12px;font-size:0.85rem;"></div>

        <button type="button" class="btn btn-primary btn-block" id="btnThanhToanGio" onclick="ThanhToanGioHang()">
            Mượn sách trong giỏ
        </button>
    </div>
</div>

<script src="../../js/api.js?v=3"></script>
<script src="../../js/auth.js?v=4"></script>
<script src="../../js/search.js?v=5"></script>
<script>
    // Kiểm tra quyền truy cập (cho reader và admin)
    YeuCauXacThuc(['reader', 'bandoc', 'admin']);
    
    // Hiển thị tên người dùng
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(user.name) document.getElementById('userNameDisplay').textContent = user.name;
</script>
</body>
</html>
