<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Mượn Trả - Thủ Thư</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/layout.css?v=4">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body>

<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-book-open"></i> Thư Viện HYUTE</h2>
        </div>
        <nav class="sidebar-nav">
            <ul id="librarianMenu"></ul>
        </nav>
        <div class="sidebar-footer" style="padding: 15px;">
            <button id="logoutBtn" class="btn btn-secondary btn-block"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng Xuất</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="header-search">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" id="loanSearchInput" placeholder="Tìm: tên Độc Giả, số thẻ, tên sách..." oninput="TimkiemPhieuMuon(this.value)">
            </div>
            <div class="header-user">
                <span style="font-weight: 500;" id="userNameDisplay">Thủ Thư</span>
                <div class="avatar">T</div>
            </div>
        </header>

        <div class="content-container table-page">
            <div class="d-flex justify-between align-center" style="margin-bottom: 8px;">
                <h1 style="color: var(--primary-color);">Quản Lý Mượn - Trả Sách</h1>
                <button class="btn btn-primary" onclick="MoModalTaoPhieuMuon()"><i class="fa-solid fa-plus"></i> Tạo Phiếu Mượn</button>
            </div>

            <!-- Bộ lọc -->
            <div class="d-flex" style="gap:8px;margin-bottom:8px;flex-wrap:wrap;">
                <select id="filterLoanStatus" class="form-control" onchange="TimkiemPhieuMuon(document.getElementById('loanSearchInput').value)" style="flex:1;min-width:150px">
                    <option value="">Mọi trạng thái</option>
                    <option value="0">Đang mượn</option>
                    <option value="1">Đã trả</option>
                    <option value="2">Quá hạn</option>
                </select>
                <input type="date" id="filterLoanFrom" class="form-control" onchange="TimkiemPhieuMuon(document.getElementById('loanSearchInput').value)" style="flex:1;min-width:150px" title="Từ ngày">
                <input type="date" id="filterLoanTo" class="form-control" onchange="TimkiemPhieuMuon(document.getElementById('loanSearchInput').value)" style="flex:1;min-width:150px" title="Đến ngày">
                <button class="btn btn-secondary" onclick="DatLaiLocPhieuMuon()">Đặt lại</button>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã Phiếu</th>
                                <th>Độc Giả</th>
                                <th>Sách</th>
                                <th>Ngày Mượn</th>
                                <th>Hạn Trả</th>
                                <th>Ngày Trả Thực</th>
                                <th>Trạng Thái</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="loanTableBody">
                            <tr><td colspan="8" style="text-align:center">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-between align-center mt-2 pt-2" style="border-top: 1px solid var(--border-color);">
                    <span class="text-muted" id="loanPageInfo" style="font-size: 0.85rem;"></span>
                    <div id="loanPagination" style="display: flex; gap: 5px;"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal Tạo Phiếu Mượn -->
<div id="loanModal" style="display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,0.5);overflow-y:auto;padding:20px 10px;">
    <div style="background:#fff;margin:2vh auto;padding:20px 25px;border-radius:8px;width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow-y:auto;box-sizing:border-box;">
        <h2 id="loanModalTitle" style="margin-top:0">Tạo Phiếu Mượn</h2>
        <form id="loanForm">
            <div style="margin-bottom:12px">
                <label>Độc Giả <span style="color:red">*</span></label>
                <select id="loanReaderId" class="form-control" style="width:100%;padding:8px;box-sizing:border-box" required></select>
            </div>
            <div style="margin-bottom:12px">
                <label>Bản Sao Sách <span style="color:red">*</span></label>
                <select id="loanCopyId" class="form-control" style="width:100%;padding:8px;box-sizing:border-box" required></select>
            </div>
            <div style="margin-bottom:12px">
                <label>Ngày Mượn</label>
                <input type="date" id="loanNgayMuon" class="form-control" style="width:100%;padding:8px;box-sizing:border-box">
            </div>
            <div style="margin-bottom:12px">
                <label>Hạn Trả</label>
                <input type="date" id="loanHanTra" class="form-control" style="width:100%;padding:8px;box-sizing:border-box">
            </div>
            <div id="loanModalError" style="color:red;margin-bottom:10px;display:none"></div>
            <div style="display:flex;justify-content:flex-end;gap:10px">
                <button type="button" class="btn btn-secondary" onclick="DongModalPhieuMuon()">Hủy</button>
                <button type="submit" class="btn btn-primary" id="btnSaveLoan">Lưu</button>
            </div>
        </form>
    </div>
</div>

<script src="../../js/api.js?v=3"></script>
<script src="../../js/auth.js?v=3"></script>
<script src="../../js/sidebar.js?v=1"></script>
<script src="../../js/loans.js?v=3"></script>
<script>
    YeuCauXacThuc(['admin','Admin','thuthu','ThuThu']);
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(user.name) document.getElementById('userNameDisplay').textContent = user.name;
</script>
</body>
</html>

</arg_value>
