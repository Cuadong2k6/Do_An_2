<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Quản lý Thư viện</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .error-message {
            display: none;
            background-color: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: var(--border-radius-sm);
            margin-bottom: 20px;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="full-screen-center">
        <div class="card login-card">
            <div class="login-header">
                <h1>Thư Viện Thông Minh</h1>
                <p>Thủ thư/Admin dùng tài khoản mật khẩu; bạn đọc dùng Google</p>
            </div>
            
            <div class="error-message" id="loginError"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="tendangnhap">Tài khoản nhân viên</label>
                    <input type="text" id="tendangnhap" class="form-control" placeholder="Tên tài khoản Admin/Thủ thư" autocomplete="username" required>
                </div>

                <div class="form-group mb-2">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding: 12px; margin-top: 20px; font-size: 1rem;">
                    Đăng nhập
                </button>
            </form>

            <div class="text-center mt-2">
                <p>Hoặc bạn đọc đăng nhập bằng Google</p>
                <div id="googleSignInButton" style="display:flex;justify-content:center"></div>
            </div>

            <div class="text-center mt-2" style="font-size: 0.9rem;">
                <a href="/pages/forgot-password.html">Quên mật khẩu?</a>
                <span style="color: var(--border-color); margin: 0 6px;">|</span>
            </div>

            <div class="text-center mt-2" style="font-size: 0.85rem; color: var(--text-muted); display: none;">
                <p id="demoCredentialsAdmin">Admin: admin / 123456</p>
                <p id="demoCredentialsReader">Bạn đọc: bandoc1@gmail.com / 123456</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js?v=5"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/auth.js?v=4"></script>
</body>
</html>
